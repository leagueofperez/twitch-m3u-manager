services:
  twitch-m3u-manager:
    container_name: 'twitch-m3u-manager'
    image: 'twitch-m3u-manager'
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: "8000"
      TWITCH_M3U_DATA_DIR: /app/data
      TWITCH_M3U_AUTH_DB: ${TWITCH_M3U_AUTH_DB:-/app/data/auth.sqlite3}
      TWITCH_M3U_COOKIE_SECURE: ${TWITCH_M3U_COOKIE_SECURE:-true}
      TWITCH_M3U_LOGIN_USERNAME: ${TWITCH_M3U_LOGIN_USERNAME:-}
      TWITCH_M3U_LOGIN_PASSWORD: ${TWITCH_M3U_LOGIN_PASSWORD:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
    volumes:
      - ./data:/app/data
