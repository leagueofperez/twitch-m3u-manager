services:
  twitch-m3u-manager:
    container_name: 'twitch-m3u-manager'
    image: 'twitch-m3u-manager'
    networks:
     - npm_network
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: "8000"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      TWITCH_M3U_DATA_DIR: /app/data
      TWITCH_M3U_AUTH_DB: ${TWITCH_M3U_AUTH_DB:-/app/data/auth.sqlite3}
      TWITCH_M3U_COOKIE_SECURE: ${TWITCH_M3U_COOKIE_SECURE:-true}
      TWITCH_M3U_LOGIN_USERNAME: ${TWITCH_M3U_LOGIN_USERNAME:-}
      TWITCH_M3U_LOGIN_PASSWORD: ${TWITCH_M3U_LOGIN_PASSWORD:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SHORT_IO_API_KEY: ${SHORT_IO_API_KEY:-}
      SHORT_IO_DOMAIN: ${SHORT_IO_DOMAIN:-}
      EXTRACTOR_WORKERS: ${EXTRACTOR_WORKERS:-2}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-16384}
    volumes:
      - ./data:/app/data

networks:
  npm_network:
    external: true
