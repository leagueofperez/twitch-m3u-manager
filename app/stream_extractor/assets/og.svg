<!--
  assets/og.svg — plantilla de la imagen social (1200x630).

  NO es la fuente de la marca: la marca vive en assets/icon.svg y el
  generador la inyecta sustituyendo el marcador {{ICON_BODY}}. Así,
  cambiar el icono no obliga a tocar este archivo.

  Ojo: dentro de un comentario XML no se pueden escribir los delimitadores
  de comentario, ni siquiera entrecomillados, porque cerrarían el bloque
  antes de tiempo.

  Editable a mano: composición, textos y colores. Para regenerar el PNG,
  `make icons`.

  El texto depende de que haya fuentes instaladas en la máquina que ejecuta
  el generador (rsvg-convert + fontconfig). En una imagen sin fuentes el
  texto saldría vacío.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6441a5" />
      <stop offset="100%" stop-color="#43296b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- El generador sustituye {{ICON_BODY}} por el contenido de assets/icon.svg
       (escalado 200/512). rsvg-convert no resuelve <image href="...svg">, así
       que inyectar el marcado es la única forma de que la imagen social y los
       iconos salgan siempre de la misma marca. -->
  <g transform="translate(110 215) scale(0.390625)">
    {{ICON_BODY}}
  </g>

  <g font-family="DejaVu Sans, Noto Sans, sans-serif" fill="#ffffff">
    <text x="390" y="292" font-size="50" font-weight="bold">Twitch Stream Extractor</text>
    <text x="390" y="346" font-size="26" fill="#ffffff" opacity="0.82">Extrae URLs m3u8 de streams en vivo y VODs</text>
  </g>
</svg>