<!--
  assets/icon.svg — marca maestra, viewBox cuadrado 512x512.

  ÚNICA fuente de verdad visual del proyecto: todos los PNG y el .ico se
  rasterizan desde aquí con tools/generate-assets.sh. Para cambiar la
  identidad visual se edita este archivo y se ejecuta `make icons`.

  No reproduce el logotipo de Twitch (marca registrada): es un triángulo
  de play genérico con arcos de señal, sobre el morado de marca.

  Los arcos son concéntricos al vértice del triángulo, para que se lean
  como ondas que emiten desde el reproductor. Trazo grueso a propósito:
  por debajo de ~34 las ondas se fusionan en una mancha a 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Twitch Stream Extractor">
  <rect width="512" height="512" rx="112" fill="#6441a5" />

  <!-- Triángulo de play, centrado horizontalmente en el lienzo -->
  <path d="M116.5 148 L246.5 256 L116.5 364 Z" fill="#ffffff" />

  <!-- Ondas de señal, concéntricas a (246.5, 256) -->
  <g fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round">
    <path d="M300.2 202.3 A76 76 0 0 1 300.2 309.7" />
    <path d="M339.8 162.7 A132 132 0 0 1 339.8 349.3" />
  </g>
</svg>