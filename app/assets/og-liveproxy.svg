<!--
  assets/og-liveproxy.svg — imagen social de LiveProxy (1200x630).

  El generador inyecta la marca de assets/icon.svg en {{ICON_BODY}}.
  Para regenerar el PNG, rasteriza este SVG con el icono ya inyectado.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6441a5" />
      <stop offset="100%" stop-color="#43296b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <g transform="translate(110 215) scale(0.390625)">
    {{ICON_BODY}}
  </g>

  <g font-family="DejaVu Sans, Noto Sans, sans-serif" fill="#ffffff">
    <text x="390" y="292" font-size="50" font-weight="bold">LiveProxy</text>
    <text x="390" y="346" font-size="26" fill="#ffffff" opacity="0.82">Genera URLs de reproducción para canales de Twitch</text>
  </g>
</svg>
